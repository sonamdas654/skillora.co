# GitHub's deep security scanner — finds vulnerable code patterns
# (injection, XSS, unsafe auth flows) in our own source.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 5 * * 3" # Wednesdays

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4.37.3
