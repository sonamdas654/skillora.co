# Monthly encrypted DB backup. The dump is AES-256 encrypted BEFORE being
# uploaded as an artifact, because artifacts on a public repo are
# downloadable — never upload raw data. Requires two repo secrets:
#   DATABASE_URL       — the Neon pooled connection string
#   BACKUP_PASSPHRASE  — any long random password (used to encrypt/decrypt)
# Until those are added, this workflow skips gracefully with a notice.
name: DB backup

on:
  schedule:
    - cron: "45 3 1 * *" # 1st of every month, 03:45 UTC (~9:15 AM IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets configured
        id: gate
        env:
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
          HAS_PW: ${{ secrets.BACKUP_PASSPHRASE != '' }}
        run: |
          if [ "$HAS_DB" != "true" ] || [ "$HAS_PW" != "true" ]; then
            echo "::warning::DATABASE_URL / BACKUP_PASSPHRASE repo secrets not set — skipping backup. Add them in Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Install deps (generates Prisma client)
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm install --no-audit --no-fund
      - name: Export all tables
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p ../skillora-backups
          node scripts/db-backup.mjs
      - name: Encrypt dump (AES-256)
        if: steps.gate.outputs.ready == 'true'
        env:
          PW: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          f=$(ls ../skillora-backups/skillora-db-*.json | head -1)
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out backup.json.enc -pass env:PW
          rm "$f"
          ls -la backup.json.enc
      - name: Upload encrypted artifact (kept 90 days)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: skillora-db-backup-${{ github.run_id }}
          path: backup.json.enc
          retention-days: 90
