# Build + lint check on every push — catches breakage before/alongside
# the Vercel deploy. Uses a dummy DATABASE_URL: no page queries the DB at
# build time (DB pages are force-dynamic), prisma generate needs no server.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
      JWT_SECRET: "ci-only-not-a-real-secret"
      # Placeholders, not credentials. The header's auth link builds a Supabase
      # browser client inside useMemo, which also executes during the
      # prerender pass — and @supabase/ssr throws outright on an empty URL or
      # key, so static pages (/faq, /_not-found, /services/*) failed to
      # prerender. Nothing here connects: no page queries Supabase at build
      # time, so any non-empty values are enough to get past construction.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
